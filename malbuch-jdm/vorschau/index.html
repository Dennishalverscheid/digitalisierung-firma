<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nacht-Drift Vorschau</title>
<style>
:root{--bg:#f4f2f7;--fg:#1a1424;--muted:#5d566a;--card:#fff;--acc:#d6266f}
@media (prefers-color-scheme:dark){:root{--bg:#120c1c;--fg:#f1edf7;--muted:#a9a1b8;--card:#1d1529;--acc:#ff5fa8}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:1200px;margin:0 auto;padding:24px 16px}
h1{margin:0 0 4px}p{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
figure{margin:0;background:var(--card);border-radius:12px;padding:10px;box-shadow:0 2px 10px #0002}
figure img{width:100%;display:block;border-radius:6px;background:#fff}
figcaption{font-size:14px;color:var(--muted);padding:8px 2px 0}
b{color:var(--acc)}
</style></head><body><main>
<h1>NACHT-DRIFT – JDM Tuning Malbuch</h1>
<p>Erste Vorschau: Titelbild + 6 Ausmalseiten. Alle Fahrzeuge sind frei erfundene Entwürfe im Stil der japanischen Tuning-Szene – ohne Marken, Logos oder Filmfahrzeuge.</p>
<div class="grid">
<figure><img src="00-cover.svg" alt="Titelbild"><figcaption><b>Titelbild</b> – Neon-Skyline, Widebody mit Drift-Rauch</figcaption></figure>
<figure><img src="01-kaze.svg" alt="Kaze"><figcaption><b>KAZE</b> – Langschnauzen-Fastback der 90er · Neonstadt</figcaption></figure>
<figure><img src="02-ryu.svg" alt="Ryu Wide"><figcaption><b>RYŪ WIDE</b> – flacher Widebody-Sportler · Parkhaus-Meet</figcaption></figure>
<figure><img src="03-kaminari.svg" alt="Kaminari GT"><figcaption><b>KAMINARI GT</b> – kantiges Allrad-Coupé · Hafen</figcaption></figure>
<figure><img src="04-toge.svg" alt="Toge 86"><figcaption><b>TŌGE 86</b> – Hatchback mit Klappscheinwerfern · Bergpass</figcaption></figure>
<figure><img src="05-shin.svg" alt="Shin S"><figcaption><b>SHIN S</b> – Drift-Coupé · Drift-Event mit Reifenstapeln</figcaption></figure>
<figure><img src="06-kaido.svg" alt="Kaido Racer"><figcaption><b>KAIDŌ RACER</b> – Old-School-Shakotan mit Takeyari-Auspuff · Ramen-Gasse</figcaption></figure>
</div></main></body></html>
